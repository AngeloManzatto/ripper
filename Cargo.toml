[package]
name = "ripper"
version = "0.1.0"
edition = "2024"

[lib]
name = "ripper"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
macroquad = "0.4"
colored = "3.1.1"
pyo3 = { version = "0.28.2", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minifb = "0.29"